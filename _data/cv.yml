      - company: NeurotechEU
        position: Ambassador for AI Safety
        location: Nijmegen, The Netherlands
        start_date: 2024-04
        end_date: 2024-10
        highlights:
          - April 2024 – October 2024. Organised discussions on AI sovereignty and the practical application of GDPR for a European university alliance connecting medicine, artificial intelligence and technology.

    Projects:
      - name: Explainable AI for Drug Response Prediction
        summary: Data pipelines, PyTorch, model evaluation.
        highlights:
          - Developed end-to-end preprocessing and machine learning pipelines for high-dimensional biomedical data, including feature engineering, model training and evaluation.
          - Compared SHAP and Integrated Gradients and implemented a deletion-based faithfulness metric; measured scores of 0.072 and 0.0858, respectively, against a 0.031 random baseline.
          - Evaluated the limits of the model and explanations; the work focused on implementation and explainability evaluation rather than claiming strong predictive accuracy.
      - name: GAN Fine-Tuning and Evaluation for Image Synthesis
        summary: PyTorch, deep learning, generative AI.
        highlights:
          - Deployed a modular Deep Convolutional GAN (DCGAN) using PyTorch for generative image synthesis, focusing on model optimisation and training stability.
          - Investigated fine-tuning and stabilisation strategies, including learning-rate scheduling, architectural ablations and hyperparameter optimisation.
      - name: Knowledge Graph Pipeline for Research Metadata
        summary: Pydantic, Cypher, FastAPI.
        highlights:
          - Designed a Neo4j knowledge graph modelling scholarly research metadata, using Cypher queries, graph traversal and relationship modelling to explore research connections.
          - Built a Python batch ingestion pipeline for the OpenAlex REST API with Pydantic validation to detect duplicate identifiers, missing references and invalid records before database ingestion.
      - name: Monte Carlo Policy Evaluation in a Markov Decision Process
        summary: Simulation, stochastic modelling.
        highlights:
          - Implemented Monte Carlo policy evaluation and control for a custom Markov Decision Process using greedy and ε-soft exploration strategies.
          - Analysed policy convergence and exploitation trade-offs through episodic training diagnostics and simulation-based evaluation.

