        position: Honours Research Internship on Optimisation
        location: Nijmegen, The Netherlands
        start_date: 2025-09
        end_date: 2026-06
        highlights:
          - September 2025 – June 2026. Explored computational approaches to optimisation and alternative architectures for challenging combinatorial problems.
          - Investigated unconventional computing approaches to large-scale combinatorial optimisation, including oscillatory Ising machine architectures for NP-hard problems.
      - company: Radboud University
        position: Teacher Assistant for Concepts of Programming Languages
        location: Nijmegen, The Netherlands
        start_date: 2025-01
        end_date: 2025-06
        highlights:
          - January 2025 – June 2025. Conducted lab classes in object-oriented and functional programming.
